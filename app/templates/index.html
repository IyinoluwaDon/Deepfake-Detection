<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face image consistency classifier</title>
<style>body{font:17px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;line-height:1.6;color:#173042}form{padding:1.5rem;background:#eef4f8;border-radius:12px}button{padding:.7rem 1rem;background:#174d67;color:white;border:0;border-radius:6px;cursor:pointer}input{display:block;margin:1rem 0}.error{color:#a51d32}.result{padding:1rem;border:1px solid #b7cbd6}</style></head><body>
<h1>Face image consistency classifier</h1><p>Educational image classifier only. The output does not establish whether an image is authentic.</p><form method="post" enctype="multipart/form-data"><label for="file1">PNG or JPEG image, maximum 8 MB</label><input id="file1" type="file" name="file1" accept="image/png,image/jpeg" required><button type="submit">Run demo</button></form>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}{% if result %}<p class="result" aria-live="polite">{{ result }}</p>{% endif %}
<p>Uploads are processed in memory and are not saved by this application.</p></body></html>
